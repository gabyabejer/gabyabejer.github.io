<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog</title>
    
    <!-- Cargando la fuente moderna 'Inter' desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Cargando Tailwind CSS para los estilos rápidos y responsivos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Aplicamos la fuente Inter a todo el documento */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<!-- bg-slate-50: fondo gris muy claro. min-h-screen: ocupa toda la pantalla. flex: centra el contenido -->
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <!-- Tarjeta principal centrada con sombra, bordes redondeados y un acento verde arriba -->
    <main class="bg-white p-8 md:p-12 rounded-2xl shadow-lg max-w-lg w-full border-t-4 border-emerald-500 text-center transition-all duration-300 hover:shadow-xl">
        
        <!-- Pequeña etiqueta estilo "pill" para darle un toque profesional -->
        <div class="inline-block bg-emerald-50 text-emerald-700 px-4 py-1.5 rounded-full text-sm font-semibold tracking-wide mb-6">
            En construcción 🚀
        </div>
